name: DesiLearCode Verification Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

      - name: Build Verification (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-build-db.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-build-prerendering-only-1234567890
          NEXT_PUBLIC_APP_URL: https://desilearncode.vercel.app
          NEXT_PUBLIC_SAFEGUARDING_EMAIL: safeguarding@desilearncode.org

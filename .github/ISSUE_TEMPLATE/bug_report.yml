name: Bug Report
description: Create a report to help us improve DesiLearCode
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: User Role Encountered Under
      description: Which platform persona was active during the issue?
      options:
        - Public Visitor
        - Hardware Donor
        - Financial Supporter
        - Volunteer Mentor
        - NGO Coordinator
        - Platform Administrator
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Environment Context
      description: Browser, OS version, or device type.
      placeholder: Chrome 132 on macOS Sequoia
